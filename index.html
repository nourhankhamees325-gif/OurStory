<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Story — Shared Sanctuary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #13090d;
      --bg-velvet: #1e0e14;
      --card-bg: rgba(38, 18, 26, 0.85);
      --card-border: rgba(235, 179, 169, 0.22);
      --rose-gold: #ebb3a9;
      --rose-accent: #d97b84;
      --candle-glow: #f5cfa0;
      --text-main: #fdf4f2;
      --text-muted: #c7a6aa;
      --danger: #e06c75;
      --success: #8ab893;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top center, #2b111b 0%, #13090d 75%);
      background-color: #13090d;
      color: #fdf4f2;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }
    .orb-1 {
      width: 340px;
      height: 340px;
      background: #8e2c48;
      top: -80px;
      left: -60px;
    }
    .orb-2 {
      width: 300px;
      height: 300px;
      background: #b57b56;
      bottom: -60px;
      right: -40px;
    }

    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #260f18 0%, #0f0609 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .fullscreen-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .lock-card {
      background: rgba(38, 18, 26, 0.9);
      border: 1px solid rgba(235, 179, 169, 0.25);
      backdrop-filter: blur(18px);
      padding: 40px 28px;
      border-radius: 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .lock-icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: pulseGlow 3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    .input-field, .textarea-field {
      width: 100%;
      background: rgba(15, 6, 10, 0.75);
      border: 1px solid rgba(235, 179, 169, 0.25);
      color: #fdf4f2;
      padding: 13px 16px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: #ebb3a9;
    }

    .btn-primary {
      background: linear-gradient(135deg, #c76574 0%, #9c3d4f 100%);
      color: #fff;
      border: none;
      padding: 13px 24px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(156, 61, 79, 0.38);
    }

    .btn-primary:hover {
      opacity: 0.94;
    }

    .btn-secondary {
      background: rgba(235, 179, 169, 0.14);
      color: #ebb3a9;
      border: 1px solid rgba(235, 179, 169, 0.25);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #whispers-screen {
      cursor: pointer;
      overflow: hidden;
    }

    .whisper-bubble {
      position: absolute;
      background: rgba(235, 179, 169, 0.12);
      border: 1px solid rgba(235, 179, 169, 0.25);
      padding: 10px 18px;
      border-radius: 999px;
      color: #ebb3a9;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      white-space: nowrap;
      pointer-events: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.95); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-15vh) scale(1.05); opacity: 0; }
    }

    .tap-hint {
      position: relative;
      z-index: 2;
      background: rgba(19, 9, 13, 0.82);
      border: 1px solid rgba(235, 179, 169, 0.25);
      padding: 28px 34px;
      border-radius: 26px;
      max-width: 420px;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 18px 80px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(235, 179, 169, 0.2);
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ebb3a9;
      cursor: pointer;
    }

    .identity-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(38, 18, 26, 0.85);
      border: 1px solid rgba(235, 179, 169, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #f5cfa0;
      cursor: pointer;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    .love-letter {
      background: linear-gradient(165deg, rgba(46, 20, 30, 0.92) 0%, rgba(27, 12, 18, 0.96) 100%);
      border: 1px solid rgba(245, 207, 160, 0.28);
      border-radius: 26px;
      padding: 34px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin-bottom: 28px;
    }

    .wax-seal {
      width: 48px;
      height: 48px;
      background: radial-gradient(circle at 30% 30%, #d45b6e, #7d2232);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
